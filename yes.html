<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aww! 💗</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: "Trebuchet MS", sans-serif;
      background: linear-gradient(135deg, #ffe5ef, #fff7fb);
      color: #5c3545;
    }

    .box {
      width: 85%;
      max-width: 500px;
      padding: 40px 20px;
      background: rgba(255,255,255,0.8);
      border-radius: 30px;
      box-shadow: 0 10px 35px rgba(150,80,110,0.15);
    }

    .cat {
      font-size: 90px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      margin-top: 25px;
      border: none;
      padding: 15px 35px;
      border-radius: 30px;
      background: #ff8fb3;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="cat">😺💗</div>

    <h1>AWW, YOU SAID YES! 🥹</h1>

    <p>
      Thank you so much! 💗
      <br>
      I was actually so excited for you to see this.
    </p>

    <button onclick="window.location.href='envelope.html'">
      NEXT → 💌
    </button>
  </div>

</body>
</html>
