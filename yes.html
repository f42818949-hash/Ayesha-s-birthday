<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aww! 💗</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff1f6, #ffe1ec);
      color: #4d2635;
    }

    .box {
      width: 90%;
      max-width: 550px;
      padding: 45px 25px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 12px 35px rgba(100, 50, 70, 0.15);
    }

    .heart {
      font-size: 70px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      font-size: 21px;
      line-height: 1.6;
    }

    button {
      border: none;
      padding: 15px 32px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      background: #ff78a5;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="heart">💗</div>

    <h1>Awww, thank you so much!</h1>

    <p>Here's your surprise! 💌</p>

    <button onclick="goNext()">NEXT →</button>

  </div>

  <script>
    function goNext() {
      window.location.href = "envelope.html";
    }
  </script>

</body>
</html>
