
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise 💌</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: Arial, sans-serif;
  background: #fff0f5;
  color: #5a3040;
}

.box {
  width: 85%;
  max-width: 500px;
  padding: 30px;
}

h1 {
  font-size: 32px;
}

p {
  font-size: 19px;
}

.cat {
  width: 180px;
  margin: 10px auto;
}

button {
  padding: 12px 24px;
  margin: 8px;
  border: none;
  border-radius: 25px;
  font-size: 17px;
  cursor: pointer;
  background: #ff8fab;
  color: white;
}

button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="box">

  <div class="cat">
    <svg viewBox="0 0 200 180" width="180">
      <path d="M45 70 L30 25 L70 45
               Q100 25 130 45 L170 25 L155 70
               Q175 100 160 130
               Q145 160 100 160
               Q55 160 40 130
               Q25 100 45 70Z"
            fill="#f2c6a0"
            stroke="#5a3040"
            stroke-width="5"/>

      <circle cx="70" cy="90" r="7" fill="#5a3040"/>
      <circle cx="130" cy="90" r="7" fill="#5a3040"/>

      <path d="M92 110 Q100 118 108 110"
            fill="none"
            stroke="#5a3040"
            stroke-width="4"/>

      <path d="M55 75 L80 82"
            stroke="#5a3040"
            stroke-width="5"/>

      <path d="M145 75 L120 82"
            stroke="#5a3040"
            stroke-width="5"/>
    </svg>
  </div>

  <h1>Heyyy! 💗</h1>

  <p>I made a little surprise for you.</p>

  <p><b>Do you wanna see? 👀</b></p>

  <button onclick="sayYes()">YES 💗</button>

  <button onclick="sayNo()">NO</button>

  <p id="message"></p>

</div>

<script>
function sayYes() {
  document.getElementById("message").innerHTML =
  "YAYYY! I knew you would say yes! 💌";
}

function sayNo() {
  window.open("angry.html", "_blank");
}
</script>

</body>
</html>
