
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aisha's Surprise 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff1f6, #ffe1ec);
      color: #4d2635;
    }

    .card {
      width: 88%;
      max-width: 520px;
      padding: 45px 25px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      box-shadow: 0 12px 35px rgba(100, 50, 70, 0.15);
    }

    .heart {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0;
    }

    .question {
      font-size: 21px;
      line-height: 1.6;
      margin: 20px 0 30px;
    }

    button {
      border: none;
      padding: 15px 30px;
      margin: 8px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .yes {
      background: #ff78a5;
      color: white;
    }

    .no {
      background: #eeeeee;
      color: #4d2635;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">💗</div>

    <h1>Heyyy, Aisha!</h1>

    <div class="question">
      I made something special for you.<br>
      <b>Do you wanna see it? 👀</b>
    </div>

    <button class="yes" onclick="goToYes()">YES 💗</button>

    <button class="no" onclick="goToNo()">NO</button>

  </div>

  <script>
    function goToYes() {
      window.location.href = "yes.html";
    }

    function goToNo() {
      window.location.href = "no.html";
    }
  </script>

</body>
</html>
