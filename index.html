

<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Surprise 💌</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #fff0f5;
      color: #5a3040;
    }

    .box {
      width: 85%;
      max-width: 500px;
      padding: 35px 20px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      line-height: 1.5;
    }

    button {
      border: none;
      padding: 14px 25px;
      margin: 10px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
    }

    .yes {
      background: #ff8fab;
      color: white;
    }

    .no {
      background: #f1d5df;
      color: #5a3040;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Heyyy, Aisha! 💗</h1>

    <p>
      I made a little surprise for you...
    </p>

    <p>
      <b>Do you wanna see? 👀</b>
    </p>

    <button class="yes" onclick="sayYes()">YES 💗</button>

    <button class="no" onclick="sayNo()">NO 😭</button>

    <p id="message"></p>

  </div>

  <script>
    function sayYes() {
      document.getElementById("message").innerHTML =
        "YAYYY! I knew you would say yes! 💌";
    }

    function sayNo() {
      document.getElementById("message").innerHTML =
        "😾 HOW DARE YOU SAY NO?! SAY YES!! 😭";
    }
  </script>

</body>
</html>
