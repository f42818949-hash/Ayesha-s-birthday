<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Surprise 💗</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: "Trebuchet MS", sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #fff4f8);
      color: #5c3545;
    }

    .box {
      width: 85%;
      max-width: 500px;
      padding: 35px 20px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 30px;
      box-shadow: 0 10px 35px rgba(150, 80, 110, 0.15);
    }

    .cat {
      font-size: 80px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 18px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .yes {
      background: #ff8fb3;
      color: white;
    }

    .no {
      background: #eeeeee;
      color: #555;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="cat">🐱</div>

    <h1>Aishu, I made something for you... 💗</h1>

    <p>
      There's a little surprise waiting for you.
      <br>
      Will you accept it? 🥺
    </p>

    <div class="buttons">
      <button class="yes" onclick="goYes()">YES 💗</button>
      <button class="no" onclick="goNo()">NO 😾</button>
    </div>
  </div>

  <script>
    function goYes() {
      window.location.href = "yes.html";
    }

    function goNo() {
      window.location.href = "no.html";
    }
  </script>

</body>
</html>
