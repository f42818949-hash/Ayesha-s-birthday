<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Surprise 💌</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: "Trebuchet MS", sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #fff7fb);
      color: #5c3545;
    }

    .container {
      width: 90%;
      max-width: 500px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .envelope {
      width: 240px;
      height: 155px;
      background: #ff9fbd;
      margin: 0 auto;
      position: relative;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(120, 60, 90, 0.2);
      transition: transform 0.2s ease;
    }

    .envelope:active {
      transform: scale(0.94);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 120px solid transparent;
      border-right: 120px solid transparent;
      border-top: 80px solid #ff709d;
    }

    .heart {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      font-size: 42px;
      z-index: 2;
    }

    .click-text {
      margin-top: 25px;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>There's something inside for you... 💗</h1>

    <p>Click the envelope, Aishu 💌</p>

    <div class="envelope" onclick="openEnvelope()">
      <div class="flap"></div>
      <div class="heart">💗</div>
    </div>

    <div class="click-text">
      Tap here ♡
    </div>

  </div>

  <script>
    function openEnvelope() {
      window.location.href = "surpriseee.html";
    }
  </script>

</body>
</html>
