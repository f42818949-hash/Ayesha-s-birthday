<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For My Aishu 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff4f8;
      color: #5b3a46;
      font-family: "Trebuchet MS", sans-serif;
    }

    .header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, #ffe1ed, #fff7fa);
    }

    .heart {
      font-size: 75px;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .header h1 {
      font-size: 38px;
      margin: 15px 0 10px;
    }

    .header p {
      font-size: 18px;
      max-width: 500px;
      line-height: 1.7;
    }

    .scroll {
      margin-top: 35px;
      font-size: 15px;
      opacity: 0.7;
    }

    .section {
      padding: 70px 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 30px 25px;
      margin-bottom: 35px;
      box-shadow: 0 10px 30px rgba(120, 70, 90, 0.12);
    }

    .number {
      font-size: 14px;
      letter-spacing: 2px;
      color: #d77b9b;
      font-weight: bold;
    }

    h2 {
      font-size: 28px;
      margin: 10px 0 20px;
    }

    .card p {
      font-size: 17px;
      line-height: 1.8;
    }

    .memory {
      background: #fff0f5;
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
    }

    .memory span {
      font-size: 45px;
    }

    .memory p {
      margin-bottom: 0;
    }

    .screenshots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .photo {
      min-height: 170px;
      border-radius: 18px;
      background: #ffe5ee;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 15px;
      font-size: 15px;
    }

    .special-note {
      background: #fff0f5;
      border-radius: 20px;
      padding: 25px;
      margin-top: 20px;
      font-size: 17px;
      line-height: 1.8;
    }

    .ending {
      text-align: center;
      padding: 90px 25px;
      background: linear-gradient(135deg, #ffe1ed, #fff7fa);
    }

    .ending h2 {
      font-size: 30px;
    }

    .ending p {
      font-size: 18px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 30px;
      }

      .screenshots {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- INTRO -->

  <div class="header">

    <div class="heart">💗</div>

    <h1>For My Aishu 🥹
