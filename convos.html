<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Cute Convos 💬</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 10px 50px;
  background: linear-gradient(135deg, #fff3f7, #ffe3ed);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

h1 {
  text-align: center;
  color: #573342;
  font-family: Georgia, serif;
  font-size: 32px;
  margin: 10px 0 8px;
}

.subtitle {
  text-align: center;
  color: #8a6573;
  font-size: 15px;
  margin-bottom: 35px;
}

.scrapbook {
  position: relative;
  max-width: 700px;
  margin: auto;
}

/* Screenshot cards */

.memory {
  position: relative;
  width: 78%;
  margin: 38px auto;
  padding: 10px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 8px 25px rgba(80, 40, 60, 0.18);
  z-index: 2;
}

.memory img {
  width: 100%;
  display: block;
  border-radius: 8px;
}

.rotate-left {
  transform: rotate(-3deg);
}

.rotate-right {
  transform: rotate(3deg);
}

.rotate-more-left {
  transform: rotate(-5deg);
}

.rotate-more-right {
  transform: rotate(5deg);
}

/* Aisha cutouts */

.cutout {
  position: absolute;
  width: 115px;
  z-index: 5;
  pointer-events: none;
}

.cutout img {
  width: 100%;
  height: auto;
  display: block;
}

/* Different positions */

.left-top {
  left: -5px;
  top: 40px;
  transform: rotate(-9deg);
}

.right-top {
  right: -5px;
  top: 250px;
  transform: rotate(9deg);
}

.left-middle {
  left: -8px;
  top: 500px;
  transform: rotate(7deg);
}

.right-middle {
  right: -8px;
  top: 760px;
  transform: rotate(-8deg);
}

.left-bottom {
  left: -5px;
  top: 1050px;
  transform: rotate(-10deg);
}

.right-bottom {
  right: -5px;
  top: 1300px;
  transform: rotate(8deg);
}

/* Little decorations */

.decoration {
  text-align: center;
  font-size: 25px;
  margin: 25px 0;
  position: relative;
  z-index: 3;
}

.back {
  display: block;
  width: fit-content;
  margin: 45px auto 0;
  padding: 13px 25px;
  border-radius: 25px;
  background: #e8799f;
  color: white;
  text-decoration: none;
  font-weight: bold;
}

@media (max-width: 500px) {

  .memory {
    width: 80%;
  }

  .cutout {
    width: 85px;
  }

  .left-top,
  .left-middle,
  .left-bottom {
    left: -3px;
  }

  .right-top,
  .right-middle,
  .right-bottom {
    right: -3px;
  }
}
</style>
</head>

<body>

<h1>💬 Our Cute Convos</h1>

<p class="subtitle">
A tiny scrapbook of the conversations I never want to forget. 🎀
</p>

<div class="scrapbook">

  <!-- Aisha cutout -->
  <div class="cutout left-top">
    <img src="aisha1.png">
  </div>

  <!-- Screenshot 1 -->
  <div class="memory rotate-left">
    <img src="convo1.jpg">
  </div>

  <div class="decoration">
    🎀 ✨ 🕊️
  </div>


  <!-- Aisha cutout -->
  <div class="cutout right-top">
    <img src="aisha2.png">
  </div>

  <!-- Screenshot 2 -->
  <div class="memory rotate-right">
    <img src="convo2.jpg">
  </div>

  <div class="decoration">
    💗 🌷 ✨
  </div>


  <!-- Screenshot 3 -->
  <div class="memory rotate-more-left">
    <img src="convo3.jpg">
  </div>


  <!-- Aisha cutout -->
  <div class="cutout left-middle">
    <img src="aisha3.png">
  </div>

  <div class="decoration">
    🦋 🎀 💌
  </div>


  <!-- Screenshot 4 -->
  <div class="memory rotate-more-right">
    <img src="convo4.jpg">
  </div>

  <div class="decoration">
    🕊️ ✨ 🌷
  </div>


  <!-- Aisha cutout -->
  <div class="cutout right-middle">
    <img src="aisha4.png">
  </div>

  <!-- Screenshot 5 -->
  <div class="memory rotate-left">
    <img src="convo5.jpg">
  </div>


  <!-- Aisha cutout -->
  <div class="cutout left-bottom">
    <img src="aisha5.png">
  </div>

  <!-- Screenshot 6 -->
  <div class="memory rotate-right">
    <img src="convo6.jpg">
  </div>


  <!-- Aisha cutout -->
  <div class="cutout right-bottom">
    <img src="aisha6.png">
  </div>

</div>

<a class="back" href="surprise.html">
  ← Back to the surprise
</a>

</body>
</html>
